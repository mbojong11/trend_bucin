<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My grilll</title>
<style>
:root{--red:#ff2f3f;--pink:#ff7ab5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;overflow-x:hidden}
body{color:#fff;font-family:'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#stage{position:relative;width:min(96vw,640px);aspect-ratio:1/1;margin:0 auto}
#stage span.w{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;color:var(--red);font-weight:600}
#stage span.w.on{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;color:#fff;text-shadow:0 0 10px #fff}12%{opacity:1;color:#fff;text-shadow:0 0 10px #ff9ab5}55%{opacity:1;color:#ffc4d4;text-shadow:none}100%{opacity:1;color:var(--red);text-shadow:none}}
#stage span.w.done{opacity:1;color:var(--red);animation:none}
#stage span.w.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:1;color:var(--red)}18%{opacity:1;color:#fff;text-shadow:0 0 8px #ff9ab5}100%{opacity:1;color:var(--red);text-shadow:none}}
#photo{position:absolute;left:50%;top:47.3%;width:38%;aspect-ratio:1/1;transform:translate(-50%,-50%);opacity:0;transition:opacity 2s;filter:drop-shadow(0 0 12px #ff2f6f)}
#photo.on{opacity:1;animation:beat 1.8s ease-in-out infinite}
#photo svg{width:100%;height:100%;overflow:visible}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.06)}30%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.04)}}
#ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 12px 6px}
button,label.b{font:inherit;font-size:15px;background:#ff2f5f;color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
label.b,button.g{background:transparent;border:1px solid #ff2f5f}
#note{font-size:14px;color:#ffb3c8;margin:4px 12px 18px;text-align:center;opacity:.85}
</style>
</head>

  const N0=240,P=[],Q=[],pcy=cy+1.5*k,ks=0.38*S/40*1.15;
  for(let i=0;i<N0;i++){const t=i/N0*Math.PI*2;
    P.push([cx+hx(t)*k*.97,cy+(yc+(hy(t)-yc)*.97)*k]);
    Q.push([cx+hx(t)*ks*1.12,pcy+(hy(t)-2.5)*ks*1.12]);}
  const free=(x,y)=>[y-h/2,y,y+h/2].every(yy=>inPoly(x,yy,P)&&!inPoly(x,yy,Q));
  const order=words.slice().sort(()=>Math.random()-.5);let wi=0;const items=[];
  for(let y=S*0.09+rowH/2;y<S*0.915;y+=rowH){
    const segs=[];let a=null;
    for(let x=0;x<=S;x+=2){const ok=x<S&&free(x,y);
      if(ok&&a===null)a=x;
      if(!ok&&a!==null){if(x-a>=44)segs.push([a+3,x-3]);a=null}}
    for(const [a0,b0] of segs){
      const L=b0-a0,row=[];let sum=0,miss=0;
      while(miss<3){
        const txt=order[wi++%order.length],m=[.88,1,1,1.1][Math.random()*4|0],w=cv.measureText(txt).width*m;
        if(sum+w+8*row.length<=L){row.push({txt,m,w});sum+=w;miss=0}else miss++;
      }
      if(!row.length)continue;
      const n=row.length,gap=n>1?Math.min((L-sum)/(n-1),28):0;
      let x=a0+(L-(sum+gap*(n-1)))/2;
      for(const r of row){items.push({x:x+r.w/2,y,txt:r.txt,m:r.m});x+=r.w+gap}
    }
  }
  items.forEach(it=>{let bd=1e9,bi=0;P.forEach((p,i)=>{const d=Math.hypot(p[0]-it.x,p[1]-it.y);if(d<bd){bd=d;bi=i}});
    it.d=bd;it.i=bi;it.key=it.x+(Math.random()-.5)*S*.35});
  const byD=items.slice().sort((a,b)=>a.d-b.d),nr=Math.ceil(items.length*.38);
  const seq=[...byD.slice(0,nr).sort((a,b)=>a.i-b.i),...byD.slice(nr).sort((a,b)=>a.key-b.key)];
  const T0=1400,D=12400;
  seq.forEach((it,j)=>{
    const e=document.createElement('span');e.className='w';e.textContent=it.txt;
    e.style.cssText='left:'+it.x+'px;top:'+it.y+'px;font-size:'+(f*it.m)+'px';
    e.addEventListener('animationend',ev=>{if(ev.animationName==='pop')e.classList.add('done')});
    st.appendChild(e);
    if(animate)timers.push(setTimeout(()=>e.classList.add('on'),T0+j*D/seq.length));
    else e.classList.add('done');
  });
  const end=animate?T0+D:0;
  timers.push(setTimeout(()=>photo.classList.add('on'),end+300));
  timers.push(setTimeout(()=>{flashT=setInterval(()=>{const l=st.querySelectorAll('.w');if(!l.length)return;
    const e=l[Math.random()*l.length|0];e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')},650)},end));
}
build(true);
again.onclick=()=>build(true);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>build(false),250)});

// ---- Music: synthesized romantic piano-style loop ----
let ctx,playing=false,timer,step=0,audioEl=null,master,next;
const F=n=>440*Math.pow(2,(n-69)/12);
const chords=[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]];
const mel=[76,79,81,79,74,76,79,76,72,76,81,76,77,76,72,69];
function tone(f,t,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function sched(){
  while(next<ctx.currentTime+.6){
    const bar=Math.floor(step/4)%4,b=step%4,ch=chords[bar];
    for(let k=0;k<2;k++)tone(F(ch[(b*2+k)%4]-12),next+k*.25,1.4,.16,'triangle');
    if(b===0)tone(F(ch[0]-24),next,2.2,.2,'sine');
    tone(F(mel[step%16]),next,1.1,.12,'sine');
    next+=.5;step++;
  }
}
function startSynth(){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(!master){master=ctx.createGain();master.gain.value=.9;
    const dl=ctx.createDelay();dl.delayTime.value=.32;const fb=ctx.createGain();fb.gain.value=.38;
    dl.connect(fb);fb.connect(dl);master.connect(ctx.destination);master.connect(dl);dl.connect(ctx.destination)}
  ctx.resume();next=ctx.currentTime+.1;timer=setInterval(sched,150);sched();
}
function stopSynth(){clearInterval(timer);if(ctx)ctx.suspend()}
play.onclick=()=>{
  if(!playing){audioEl?audioEl.play():startSynth();playing=true;play.textContent='⏸ Jeda Lagu';note.textContent='🎶 Lagu romantis sedang diputar...'}
  else{audioEl?audioEl.pause():stopSynth();playing=false;play.textContent='▶ Putar Lagu'}
};
file.onchange=e=>{const f=e.target.files[0];if(!f)return;
  if(playing&&!audioEl)stopSynth();if(audioEl)audioEl.pause();
  audioEl=new Audio(URL.createObjectURL(f));audioEl.loop=true;audioEl.play();
  playing=true;play.textContent='⏸ Jeda Lagu';note.textContent='🎶 Memutar: '+f.name};
</script>
